# Nearest-workspace root for this standalone plugin package, so pnpm treats it
# as an independent workspace even when checked out next to other package
# managers' workspaces (the family convention).
packages:
  - .

# pnpm ignores dependency build scripts by default (ERR_PNPM_IGNORED_BUILDS).
# esbuild (via vitest/vite) is the only one this package needs.
allowBuilds:
  esbuild: true

verifyDepsBeforeRun: false

# The suite pins the five 2026-11-10 research releases. They are newer than
# pnpm 12's 24h minimum-release-age window, so a fresh install would reject
# the pins; exclude exactly those versions instead of disabling the policy.
minimumReleaseAgeExclude:
  - dsh-cite-verify@0.2.0
  - dsh-doc-anchor@0.2.0
  - dsh-library@0.3.0
  - dsh-research-report@0.4.0
  - dsh-sr-ledger@0.2.0
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
  - '@deepseek-ai/dsh-error@0.2.2-rc.3'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.3'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session@0.2.2-rc.3'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.3'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.3'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.3'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.3'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.3'
